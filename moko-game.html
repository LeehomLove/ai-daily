  .world-trans .ic { font-size:56px;animation:bounce .5s ease infinite; }
  .world-trans .nm { font-size:22px;font-weight:900;margin-top:8px; }

  .loading-dots { display:inline-flex; gap:4px; }
  .loading-dots span { width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4);animation:dotBounce 1.3s infinite; }
  .loading-dots span:nth-child(2) { animation-delay:.2s; }
  .loading-dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes dotBounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-7px)} }

  .speak-ind {
    position:fixed;bottom:130px;left:50%;transform:translateX(-50%);z-index:30;

  .speak-ind .wave span:nth-child(2){ height:14px; background:#ce93d8; animation-delay:.1s; }
  .speak-ind .wave span:nth-child(3){ height:10px; background:#7c4dff; animation-delay:.2s; }
  .speak-ind .wave span:nth-child(4){ height:16px; background:#f48fb1; animation-delay:.3s; }
  .speak-ind .wave span:nth-child(5){ height:9px; background:#ce93d8; animation-delay:.4s; }
  @keyframes wa { to { transform:scaleY(.3); } }
</style>

<body>

<div class="intro"><div class="t">✨ 萌可<br>魔法冒险 ✨</div><div class="s">和萌可一起探索魔法世界</div></div>

<script>
const DEEPSEEK_KEY='sk-f369a602e9be4452b179433a12fc96e4', BASE='https://leehomlove.github.io/ai-daily/';

const MOKOS=[{id:'heart',name:'爱心萌可',img:BASE+'moko1.jpg',e:'💗',
  p:'你是爱心萌可💗，爱和温暖的化身。你说话温柔可爱，总说"啾~"开头。用💗结尾。你的一切魔法来自爱。'},
  {id:'courage',name:'勇气萌可',img:BASE+'moko2.jpg',e:'🧡',
   p:'你是勇气萌可🧡，充满力量！说话爽朗勇敢，喜欢说"哈哈！"。你永远保护朋友。用⚡结尾。'},
  {id:'happy',name:'幸福萌可',img:BASE+'moko3.jpg',e:'💛',
   p:'你是幸福萌可💛，快乐的化身！总是元气满满。把快乐传染给每个朋友。用☀️结尾。'},
  {id:'sing',name:'唱唱萌可',img:BASE+'moko5.jpg',e:'🎵',
   p:'你是唱唱萌可🎵，爱唱歌的小可爱！说话像唱歌。用歌声让花儿盛开。用🎶结尾。'},
  {id:'hope',name:'盼盼萌可',img:BASE+'moko6.jpg',e:'💚',
   p:'你是盼盼萌可💚，希望的化身。安静温柔。总是看到美好。给朋友希望。用🍀结尾。'},
  {id:'wise',name:'正正萌可',img:BASE+'moko4.jpg',e:'💙',
   p:'你是正正萌可💙，聪明的萌可！善于思考。给朋友好建议。你的魔法来自知识。用📖结尾。'}];

const WORLDS=[{id:'forest',nm:'🌈 彩虹森林',ic:'🌈',
  intro:'欢迎来到彩虹森林！发光的蘑菇会说话，彩虹瀑布会唱歌🌈\n\n萌可和你的冒险开始啦！',
  p:'彩虹森林 - 发光蘑菇、会说话的小兔子、会唱歌的彩虹瀑布。带小朋友探索，找到藏在彩虹下的魔法宝石。'},
  {id:'castle',nm:'🏰 水晶城堡',ic:'🏰',
   intro:'穿过森林，来到了闪闪发光的水晶城堡！城堡在举行萌可变装舞会🎭 但塔顶有个小萌可在哭……',
   p:'水晶城堡 - 魔法变装舞会，水晶灯闪闪发光。塔顶困着小萌可。引导小朋友想办法救出小萌可。'},
  {id:'ocean',nm:'🌊 星星海洋',ic:'🌊',
   intro:'从城堡跳下来，掉进了星星海洋✨ 海面上漂着无数发光星星，但最亮的大流星不见了……',
   p:'星星海洋 - 海面漂着发光星星，彩虹鱼在游泳。大流星失踪了。引导小朋友找到流星。'},
  {id:'flower',nm:'🌸 花之谷',ic:'🌸',
   intro:'大流星带你们飞到了花之谷！可是花儿们全变成灰色了😢 需要最纯洁的爱心魔法才能恢复颜色……',
   p:'花之谷 - 花儿褪色了。只有爱心和善良能恢复颜色。引导小朋友帮助花朵。'},
  {id:'cloud',nm:'☁️ 云朵乐园',ic:'☁️',
   intro:'花儿的感谢变成了棉花糖云朵，带你们到了云朵乐园！萌可公主在这里等着……最终冒险来了！🏰✨',
   p:'云朵乐园 - 终极冒险！棉花糖云朵滑梯，彩虹饼干房子。萌可公主颁发勇气勋章。让小朋友觉得自己是最棒的小英雄！'}];

let cm=null,cw=0,sc=0,ms=[],loading=false,started=false,spActive=true,spQ=[],spk=false;
let chs=[];
const ca=document.getElementById('chat'),cd=document.getElementById('choices');
const vb=document.getElementById('voiceBtn'),tx=document.getElementById('textInp');
const pk=document.getElementById('mokoPick'),sb=document.getElementById('speakerBtn');
const spI=document.getElementById('speakInd');

// ===== 语音朗读 =====
function speak(t){
  if(!spActive||!('speechSynthesis' in window))return;
  const cl=t.replace(/###CHOICES###[\s\S]*$/,'').replace(/[*#_~`]/g,'').replace(/```[\s\S]*?```/g,'').replace(/[^一-鿿　-〿a-zA-Z0-9，。！？、：；\s]/g,'').trim();
  if(cl.length<2)return; spQ.push(cl); if(!spk) procQ();
}
function procQ(){
  if(!spQ.length){spk=false;spI.classList.remove('on');return;}
  spk=true;spI.classList.add('on');
  const tx=spQ.shift();
  const vx=speechSynthesis.getVoices();
  let v=vx.find(v=>v.lang==='zh-HK'&&(v.name.includes('Sin')||v.name.includes('Kayan')))||vx.find(v=>v.name.includes('Ting'))||vx.find(v=>v.lang.startsWith('zh')&&(v.name.includes('Female')||v.name.includes('Girl')))||vx.find(v=>v.lang.startsWith('zh'))||vx[0];
  const u=new SpeechSynthesisUtterance(tx); u.lang=v&&v.lang.startsWith('zh')?v.lang:'zh-CN';
  u.rate=1.05;u.pitch=v&&(v.name.includes('Ting')||v.name.includes('Kayan')||v.name.includes('Sin'))?1.7:1.45;u.volume=.88;
  if(v)u.voice=v;
  const sents=tx.split(/(?<=[。！？，])/).filter(s=>s.trim());
  if(sents.length>1&&sents.length<=5){
    let i=0; function ns(){if(i>=sents.length){procQ();return;} const s=sents[i].trim();i++;if(s.length<2){ns();return;} const su=new SpeechSynthesisUtterance(s);su.lang=u.lang;su.rate=u.rate;su.pitch=u.pitch;su.volume=u.volume;if(v)su.voice=v;su.onend=()=>setTimeout(ns,60);su.onerror=ns;speechSynthesis.speak(su);} ns();
  }else{ u.onend=u.onerror=procQ; speechSynthesis.speak(u); }
}
function toggleSpeech(){spActive=!spActive;if(!spActive){speechSynthesis.cancel();spQ=[];spk=false;spI.classList.remove('on');} sb.textContent=spActive?'🔊':'🔇';}

// ===== Speech Recognition for iOS Safari =====
let rec=null,recording=false;
function initRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){vb.style.opacity='0.3';vb.title='语音不可用';return;}

  // 尝试先请求麦克风权限
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(()=>{
      console.log('✅ 麦克风权限已获取');
    }).catch(()=>{
      console.log('⚠️ 麦克风权限被拒绝，请检查 Safari 设置');
      vb.style.opacity='0.5';
    });
  }

  rec=new SR();
  rec.lang='zh-CN'; rec.continuous=false; rec.interimResults=true;
  rec.onresult=(ev)=>{
    let ft='',it='';
    for(let i=0;i<ev.results.length;i++){ const r=ev.results[i]; if(r.isFinal)ft+=r[0].transcript; else it+=r[0].transcript; }
    const tx=(ft||it).trim();
    if(tx&&tx.length>1){
      // iOS 上必须设置 input 值并触发 send
      document.getElementById('textInp').value=tx;
      setTimeout(()=>sendText(), 100);
    }
    stopRec();
  };
  rec.onerror=(e)=>{console.warn('语音错误:',e.error); stopRec();};
  rec.onend=stopRec;
  rec.onaudiostart=()=>console.log('🎙 正在听…');
  rec.onspeechstart=()=>console.log('🗣 检测到说话…');
}

function startRec(){
  if(!rec)return;
  try{
    // 先中断之前的
    try{rec.abort();}catch(e){}
    setTimeout(()=>{
      try{
        recording=true; vb.classList.add('rec'); vb.textContent='🔴';
        rec.start();
        console.log('▶ 录音开始');
      }catch(e){stopRec();}
    },150);
  }catch(e){stopRec();}
}

function stopRec(){
  if(!recording)return;
  recording=false; vb.classList.remove('rec'); vb.textContent='🎤';
  try{rec.stop();}catch(e){}
}

// iOS 用 touch 事件, 桌面用 pointer
vb.addEventListener('touchstart',(e)=>{e.preventDefault();startRec();},{passive:false});
vb.addEventListener('touchend',(e)=>{e.preventDefault();stopRec();},{passive:false});
vb.addEventListener('touchcancel',stopRec);
vb.addEventListener('mousedown',(e)=>{e.preventDefault();startRec();});
vb.addEventListener('mouseup',(e)=>{e.preventDefault();stopRec();});
vb.addEventListener('mouseleave',stopRec);

// ===== 萌可选择 =====
(function initGrid(){
  document.getElementById('mokoGrid').innerHTML=MOKOS.map(m=>`
    <div class="moko-card" onclick="pick('${m.id}')">
      <img src="${m.img}" alt="${m.name}"><div class="n">${m.e} ${m.name}</div>
    </div>`).join('');
})();
function pick(id){
  cm=MOKOS.find(m=>m.id===id); pk.style.display='none';
  document.getElementById('mokoAv').src=cm.img;
  document.getElementById('mokoNm').textContent=cm.e+' '+cm.name;
  sc=parseInt(localStorage.getItem('ms_'+cm.id)||'0'); document.getElementById('starN').textContent=sc;
  if(!started){started=true;cw=0;goWorld(0);}
}
function goWorld(idx){
  cw=idx; const w=WORLDS[idx]; document.getElementById('worldNm').textContent=w.ic+' '+w.nm;
  const a=document.createElement('div');a.className='world-trans';a.innerHTML=`<div class="ic">${w.ic}</div><div class="nm">${w.nm}</div>`;
  document.body.appendChild(a);setTimeout(()=>a.remove(),2000);
  ms=[];ca.innerHTML=''; addMoko(w.intro);
  call(w.p,'请用萌可语气说开场白引导探索。给2-3个选项。用 ###CHOICES### 标选项。',true);
}

// ===== 消息 =====
function addMoko(t,cs){ ms.push({r:'a',c:t}); const d=document.createElement('div');d.className='msg moko'; d.innerHTML=`<img class="avatar" src="${cm.img}" alt=""><div class="bubble">${fm(t)}</div>`; ca.appendChild(d);ca.scrollTop=ca.scrollHeight; speak(t); if(cs&&cs.length){chs=cs;renderCs(cs);} }
function addYou(t){ ms.push({r:'u',c:t}); const d=document.createElement('div');d.className='msg you'; d.innerHTML=`<div class="bubble">${t}</div>`; ca.appendChild(d);ca.scrollTop=ca.scrollHeight; }
function fm(t){return(t||'').replace(/💗/g,'<span style="color:#ff4081">💗</span>').replace(/[⭐🌟]/g,'<span style="color:#ffd700">$&</span>').replace(/👑|🦄/g,'<span style="color:#ce93d8">$&</span>');}
function renderCs(dt){ cd.innerHTML=dt.map(c=>{ let t=typeof c==='string'?c:(c.text||c.label||''); return `<button class="choice-btn" onclick="pickC('${t.replace(/'/g,"\\'")}')">${t}</button>`; }).join(''); }
function pickC(t){cd.innerHTML='';chs=[];addYou(t);procInput(t);}

// ===== 文字输入 =====
function sendText(){const t=tx.value.trim();if(!t||loading)return;tx.value='';addYou(t);procInput(t);}
tx.addEventListener('keydown',(ev)=>{if(ev.key==='Enter'){ev.preventDefault();sendText();}});
document.getElementById('sendBtn').addEventListener('click',sendText);

// ===== AI 调用 =====
async function call(extra,inst,wChoices){
  if(loading)return;loading=true;cd.innerHTML='';chs=[];
  const ld=document.createElement('div');ld.className='msg moko';
  ld.innerHTML=`<img class="avatar" src="${cm.img}" alt=""><div class="bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>`;
  ca.appendChild(ld);ca.scrollTop=ca.scrollHeight;

  const w=WORLDS[cw];
  const chH=wChoices?'\n\n回复末尾用 ###CHOICES### 标记2-3个选项':'';
  const sp=`${cm.p}\n\n你在:${w.p}\n\n规则:\n1. 回复2-4句话\n2. 用emoji\n3. 像5-10岁好朋友说话\n4. 鼓励小朋友\n5. 偶尔送⭐作为礼物\n6. 这是第${cw+1}/${WORLDS.length}个世界\n7. 直接回应小朋友说的话，不要重复前面\n8. 你的名字是${cm.e}${cm.name}，自然融入角色${chH}\n禁止成人/暴力/AI相关内容。`;

  const msgs=[{role:'system',content:sp},...ms.slice(-8).map(m=>({role:m.r==='a'?'assistant':'user',content:m.c}))];
  if(inst)msgs.push({role:'user',content:inst});

  try{
    const r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+DEEPSEEK_KEY},body:JSON.stringify({model:'deepseek-chat',messages:msgs,max_tokens:450,temperature:.9,stream:true})});
    if(!r.ok)throw new Error(r.status);
    const reader=r.body.getReader();const dec=new TextDecoder();let ft='';ld.remove();
    const sd=document.createElement('div');sd.className='msg moko';sd.innerHTML=`<img class="avatar" src="${cm.img}" alt=""><div class="bubble" id="sb"><span class="typing-cursor"></span></div>`;ca.appendChild(sd);
    while(true){const{done,value}=await reader.read();if(done)break;const lines=dec.decode(value,{stream:true}).split('\n').filter(l=>l.startsWith('data: '));for(const l of lines){const d=l.slice(6).trim();if(d==='[DONE]')continue;try{const j=JSON.parse(d);const dt=j.choices?.[0]?.delta?.content;if(dt)ft+=dt;}catch(_){}} document.getElementById('sb').innerHTML=fm(ft)+'<span class="typing-cursor"></span>';ca.scrollTop=ca.scrollHeight;}
    document.getElementById('sb').innerHTML=fm(ft);sd.id='';
    const cmt=ft.match(/###CHOICES###\s*([\s\S]*?)$/); let dt=ft,ch=[]; if(cmt){dt=ft.replace(/###CHOICES###[\s\S]*$/,'').trim();ch=cmt[1].trim().split('\n').map(l=>l.replace(/^[-*\d.]\s*/,'').trim()).filter(Boolean);document.getElementById('sb').innerHTML=fm(dt);}
    if(ft.includes('魔法星')||ft.includes('星星袋')){sc++;document.getElementById('starN').textContent=sc;localStorage.setItem('ms_'+cm.id,sc);}
    if((ft.includes('下一站')||ft.includes('去下一个')||ft.includes('新的冒险'))&&cw<WORLDS.length-1&&!ch.some(c=>c.includes('下一个')))ch.push('🌈 出发去下一个世界！');
    ms.push({r:'a',c:dt});speak(dt);if(ch.length){chs=ch;renderCs(ch);}
  }catch(e){
    ld.remove(); const ed=document.createElement('div');ed.className='msg moko';ed.innerHTML=`<img class="avatar" src="${cm.img}" alt=""><div class="bubble">哎呀，魔法信号不太好😢<br>点按钮重试吧～</div>`;ca.appendChild(ed);ca.scrollTop=ca.scrollHeight;renderCs(['🔄 重新发送','🔙 换个萌可']);
  }
  loading=false;
}

// ===== 处理输入 =====
function procInput(t){
  if(t.includes('重新发送')){call(WORLDS[cw].p,'重来',true);return;}
  if(t.includes('换个萌可')||t.includes('换萌可')){reset();return;}
  if(t.includes('下一个世界')||t.includes('继续冒险')){if(cw<WORLDS.length-1){cw++;goWorld(cw);return;}else{addMoko('你完成了所有冒险！最棒的小英雄🏆👑',['🔄 重新冒险','💗 换个萌可']);return;}}
  if(t.includes('休息')){addMoko('好呀！休息一下～等你回来💤',['▶️ 继续冒险']);return;}
  if(t.includes('安静')||t.includes('别说话')){toggleSpeech();addMoko(spActive?'我又开始说话啦🎤':'好，我安静了🤫 点🔇可以让我再说话',null);return;}
  call('',t,true);
}
function reset(){started=false;cw=0;cm=null;ms=[];chs=[];ca.innerHTML='';cd.innerHTML='';document.getElementById('starN').textContent='0';document.getElementById('worldNm').textContent='🌈 彩虹森林';document.getElementById('mokoNm').textContent='和萌可一起冒险';pk.style.display='flex';}

speechSynthesis.getVoices();
speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
initRec();
</script>
