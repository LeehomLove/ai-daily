  .speaking-indicator .wave span {

  .speaking-indicator .wave span:nth-child(2) { height:14px; --c:#ce93d8; animation-delay:.1s; }
  .speaking-indicator .wave span:nth-child(3) { height:10px; --c:#7c4dff; animation-delay:.2s; }
  .speaking-indicator .wave span:nth-child(4) { height:16px; --c:#f48fb1; animation-delay:.3s; }
  .speaking-indicator .wave span:nth-child(5) { height:9px; --c:#ce93d8; animation-delay:.4s; }
  @keyframes waveAnim { to { transform:scaleY(.4); } }
</style>

<script>

const WORLDS = [

    intro:'呀～欢迎来到彩虹森林！这里彩色蘑菇会发光，小动物们会说话，还有一条会唱歌的彩虹瀑布🌈\n\n萌可和你的冒险就要开始啦！',
    prompt:'彩虹森林 - 发光的彩色蘑菇、会说话的小兔子、会唱歌的彩虹瀑布。带小朋友认识这个魔法世界，发现第一个魔法宝石藏在彩虹下面。' },

    intro:'大流星带你们飞到了花之谷！可是……花儿们全都变成了灰色😢 只有最纯洁的爱心魔法才能让花儿恢复颜色……',
    prompt:'花之谷 - 花儿都褪色成了灰白色，小花们在哭泣。只有爱心和善良能恢复颜色。引导小朋友帮助花朵（可以通过夸夸花朵、唱歌、或者收集其它花儿的颜色）。' },
  { id:'cloud', name:'☁️ 云朵乐园', icon:'☁️',
    intro:'花儿们都恢复了色彩，它们的感谢变成了棉花糖云朵，把你们送到了云朵乐园！萌可公主在这里等着你们……这是最后的冒险！🏰✨',
    prompt:'云朵乐园 - 终极冒险！棉花糖云朵做的滑梯，彩虹饼干做的房子。萌可公主在这里发勇气勋章。回顾冒险回忆，给小朋友颁奖，让小朋友觉得自己是最棒的小英雄！' },
];

let currentMoko=null, currentWorld=0, starCount=0, messages=[], isLoading=false, adventureStarted=false;
let currentChoices=[], speechActive=true, speechQueue=[], speaking=false;

const chat=document.getElementById('chat'), choices=document.getElementById('choices');
const voiceBtn=document.getElementById('voiceBtn'), textInput=document.getElementById('textInput');
const selectScreen=document.getElementById('selectScreen');
const speakerBtn=document.getElementById('speakerBtn'), speakingInd=document.getElementById('speakingInd');

// ===== 萌可语音系统 =====
function speakText(text) {
  if (!speechActive || !('speechSynthesis' in window)) return;
  const clean = text
    .replace(/###CHOICES###[\s\S]*$/,'')
    .replace(/[*#_~`]/g,'')
    .replace(/```[\s\S]*?```/g,'')
    .replace(/[^一-鿿　-〿＀-￯a-zA-Z0-9，。！？、：；""''（）\s]/g,'')
    .trim();
  if (clean.length < 2) return;
  speechQueue.push(clean);
  if (!speaking) processSpeechQ();
}

function processSpeechQ() {
  if (!speechQueue.length) { speaking=false; speakingInd.classList.remove('show'); return; }
  speaking=true; speakingInd.classList.add('show');
  const text = speechQueue.shift();

  // 找最可爱的声音
  const voices = speechSynthesis.getVoices();

  // 给不同的萌可选不同的可爱声音
  let voice = null;
  const mokoId = currentMoko ? currentMoko.id : '';

  // 按萌可角色匹配声音
  if (mokoId === 'heart' || mokoId === 'hope') {
    // 爱心萌可、盼盼萌可 → 找最温柔的女声
    voice = voices.find(v => v.name.includes('Tingting') || v.name.includes('Ting-Ting') || v.name.includes('Hsiao')) // 温柔女声
    || voices.find(v => v.name.includes('Ya') && v.lang.startsWith('zh')) // 雅
    || voices.find(v => v.name.includes('Mei') && v.lang.startsWith('zh')) // 美
    || voices.find(v => v.lang === 'zh-CN' && v.name.includes('Female'));
  } else if (mokoId === 'courage' || mokoId === 'wise') {
    // 勇气萌可、正正萌可 → 稍微成熟的声音
    voice = voices.find(v => v.name.includes('Yu') || v.name.includes('Wen')) // 宇/文
    || voices.find(v => v.lang.startsWith('zh') && (v.name.includes('Female') || v.name.includes('Girl')));
  } else {
    // 其他萌可 → 最甜的声音
    voice = voices.find(v => v.name.includes('Kayan') || v.name.includes('Hsiao'))
    || voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh-TW');
  }

  // 兜底：找任何中文女声
  if (!voice) voice = voices.find(v => v.lang.startsWith('zh') && (
    v.name.includes('Female') || v.name.includes('Girl') || v.name.includes('Woman') ||
    v.name.includes('Ting') || v.name.includes('Hsiao') || v.name.includes('Ya') || v.name.includes('Mei')
  ));

  // 再兜底：任何中文声音
  if (!voice) voice = voices.find(v => v.lang.startsWith('zh'));
  // 最后的兜底：任何声音
  if (!voice) voice = voices[0];

  const u = new SpeechSynthesisUtterance(text);
  u.lang = voice && voice.lang.startsWith('zh') ? voice.lang : 'zh-CN';
  u.rate = voice && voice.lang === 'zh-HK' ? 1.0 : 1.12;
  u.pitch = voice && (voice.name.includes('Ting') || voice.name.includes('Hsiao') || voice.name.includes('Kayan') || voice.name.includes('Ya')) ? 1.65 : 1.45;
  u.volume = 0.9;
  if (voice) u.voice = voice;

  u.onend = u.onerror = () => processSpeechQ();

  // 添加小停顿让语气更自然
  const naturalText = text
    .replace(/！/g, '！ ')
    .replace(/？/g, '？ ')
    .replace(/～/g, '～ ')
    .replace(/💗/g, ' 啾～')
    .replace(/[🌟⭐✨]/g, '✨')
    .replace(/⚡/g, '乒！')
    .replace(/☀️/g, '阳光')
    .replace(/🎶/g, '啦啦～')
    .replace(/🍀/g, '幸运')
    .replace(/📖/g, '')
    .replace(/🦄/g, '')
    .replace(/👑/g, '')
    .replace(/[^*#~`]/g, c => c);

  // 太长的句子拆成短句
  const sentences = naturalText.split(/(?<=[。！？，\s])/).filter(s => s.trim());
  if (sentences.length > 1 && sentences.length <= 6) {
    // 逐句朗读，句间停顿
    let i = 0;
    function speakSentence() {
      if (i >= sentences.length) { processSpeechQ(); return; }
      const s = sentences[i].trim();
      i++;
      if (s.length < 2) { speakSentence(); return; }
      const subU = new SpeechSynthesisUtterance(s);
      subU.lang = u.lang; subU.rate = u.rate; subU.pitch = u.pitch; subU.volume = u.volume;
      if (voice) subU.voice = voice;
      subU.onend = () => setTimeout(() => speakSentence(), 80);
      subU.onerror = () => speakSentence();
      speechSynthesis.speak(subU);
    }
    speakSentence();
  } else {
    speechSynthesis.speak(u);
  }

  // 显示当前声音信息用于调试
  console.log('萌可语音:', mokoId, voice ? voice.name : 'default', 'pitch:', u.pitch);
}

// 预加载所有语音
speechSynthesis.onvoiceschanged = () => {
  const voices = speechSynthesis.getVoices();
  console.log('可用声音:', voices.filter(v=>v.lang.startsWith('zh')).map(v=>v.name+'('+v.lang+')'));
};

function toggleSpeech() {
  speechActive = !speechActive;
  if (!speechActive) { speechSynthesis.cancel(); speechQueue=[]; speaking=false; speakingInd.classList.remove('show'); }
  speakerBtn.textContent = speechActive ? '🔊' : '🔇';
}

// ===== 语音输入 - iOS Safari 优化版 =====
let recognition=null, isRecording=false;
function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { voiceBtn.style.opacity='0.4'; voiceBtn.title='语音不支持（请打字）'; return; }

  recognition = new SR();
  recognition.lang='zh-CN';
  recognition.continuous=false;
  recognition.interimResults=true;  // iOS Safari 需要 interim 才能触发 onresult
  recognition.maxAlternatives=1;

  recognition.onresult=(e)=>{
    // 优先取 final 结果，没有则取 interim 暂存
    let finalText='', interimText='';
    for(let i=0;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal){ finalText+=r[0].transcript; }
      else{ interimText+=r[0].transcript; }
    }
    const t=(finalText||interimText).trim();
    if(t && (finalText||interimText.length>3)){
      textInput.value=t;
      sendText();
    }
    stopRecording();
  };
  recognition.onerror=(e)=>{
    console.log('Speech error:',e.error);
    stopRecording();
  };
  recognition.onend=()=>stopRecording();

  // iOS Safari 14+ 需要一次手动激活
  console.log('✅ 语音识别已就绪 (iOS Safari)');
}
function startRecording() {
  if(!recognition)return;
  try{
    // 确保之前的实例彻底结束
    recognition.abort();
    // iOS 需要短暂延迟
    setTimeout(()=>{
      try{
        isRecording=true;
        voiceBtn.classList.add('recording');
        voiceBtn.textContent='🔴';
        recognition.start();
        console.log('🎤 开始录音…');
      }catch(e){ console.log('start error:',e); stopRecording(); }
    },100);
  }catch(e){ console.log('abort error:',e); }
}
function stopRecording() {
  if(!isRecording)return;
  isRecording=false;
  voiceBtn.classList.remove('recording');
  voiceBtn.textContent='🎤';
  try{ recognition.stop(); }catch(e){}
  console.log('🎤 停止录音');
}

// iOS touch 事件更可靠，用 touch 替代 pointer
voiceBtn.addEventListener('touchstart',(e)=>{e.preventDefault();startRecording();});
voiceBtn.addEventListener('touchend',(e)=>{e.preventDefault();stopRecording();});
voiceBtn.addEventListener('touchcancel',stopRecording);
// 保留 pointer 作为桌面端兼容
voiceBtn.addEventListener('pointerdown',(e)=>{e.preventDefault();startRecording();});
voiceBtn.addEventListener('pointerup',(e)=>{e.preventDefault();stopRecording();});
voiceBtn.addEventListener('pointerleave',stopRecording);

// ===== 初始化 =====
function initMokoGrid() {
  mokoGrid.innerHTML = MOKOS.map(m=>`
    <div class="moko-card" onclick="pickMoko('${m.id}')">
      <img src="${m.img}" alt="${m.name}">
      <div class="name">${m.emoji} ${m.name}</div>
    </div>`).join('');
}
function pickMoko(id) {
  currentMoko=MOKOS.find(m=>m.id===id); selectScreen.style.display='none';
  document.getElementById('mokoAvatar').src=currentMoko.img;
  document.getElementById('mokoName').textContent=currentMoko.emoji+' '+currentMoko.name;
  starCount=parseInt(localStorage.getItem('moko_stars_'+currentMoko.id)||'0');
  document.getElementById('starCount').textContent=starCount;
  if(!adventureStarted){ adventureStarted=true; currentWorld=0; startWorld(0); }
}
function startWorld(idx) {
  currentWorld=idx; const w=WORLDS[idx];
  document.getElementById('worldName').textContent=w.icon+' '+w.name;
  const anim=document.createElement('div'); anim.className='world-transition';
  anim.innerHTML=`<div class="icon">${w.icon}</div><div class="name">${w.name}</div>`;
  document.body.appendChild(anim); setTimeout(()=>anim.remove(),2000);
  messages=[]; chat.innerHTML=''; addMokoMsg(w.intro);
  callAI(w.prompt,'请用萌可的语气说开场白引导小朋友探索。给2-3个选项。记住用 ###CHOICES### 标记选项。',true);
}

// ===== 消息渲染 =====
function addMokoMsg(text, chData) {
  messages.push({role:'assistant',content:text});
  const d=document.createElement('div'); d.className='msg moko';
  d.innerHTML=`<img class="avatar" src="${currentMoko.img}" alt=""><div class="bubble">${fmt(text)}</div>`;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
  speakText(text);
  if(chData&&chData.length){ currentChoices=chData; renderChoices(chData); }
}
function addUserMsg(text) {
  messages.push({role:'user',content:text});
  const d=document.createElement('div'); d.className='msg user';
  d.innerHTML=`<div class="bubble">${text}</div>`;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
function fmt(t) {
  return (t||'').replace(/❤️|💗/g,'<span style="color:#ff4081">$&</span>')
    .replace(/✨|⭐|🌟/g,'<span style="color:#ffd700">$&</span>')
    .replace(/🦄|👑/g,'<span style="color:#ce93d8">$&</span>')
    .replace(/\*\*(.*?)\*\*/g,'<b>$1</b>');
}
function renderChoices(data) {
  choices.innerHTML=data.map(c=>{
    let t=typeof c==='string'?c:(c.text||c.label||'');
    return `<button class="choice-btn" onclick="pickChoice('${t.replace(/'/g,"\\'")}')">${t}</button>`;
  }).join('');
}
function pickChoice(text) { choices.innerHTML='';currentChoices=[]; addUserMsg(text); processUserInput(text); }

// ===== 文字输入 =====
function sendText() { const t=textInput.value.trim(); if(!t||isLoading)return; textInput.value=''; addUserMsg(t); processUserInput(t); }
textInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){e.preventDefault();sendText();} });
document.getElementById('sendBtn').addEventListener('click',sendText);

// ===== AI 调用 =====
async function callAI(extra, instruction, withChoices) {
  if(isLoading)return; isLoading=true; choices.innerHTML='';currentChoices=[];
  const ld=document.createElement('div'); ld.className='msg moko'; ld.id='loadingMsg';
  ld.innerHTML=`<img class="avatar" src="${currentMoko.img}" alt=""><div class="bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(ld); chat.scrollTop=chat.scrollHeight;

  const w=WORLDS[currentWorld];
  const chHint=withChoices?'\n\n回复末尾务必用 ###CHOICES### 然后每行一个选项（2-3个），例如：\n###CHOICES###\n🌈 去彩虹桥\n🌲 走神秘小路':'';
  const sp=`${currentMoko.persona}

你在冒险世界：${w.prompt}

规则：
1. 回复3-6句话，用emoji让对话有趣
2. 像5-10岁孩子的好朋友那样说话
3. 总是鼓励小朋友，表扬他们的选择
4. 偶尔送魔法星⭐作为礼物
5. 这是第${currentWorld+1}/${WORLDS.length}个世界${chHint}
6. 不要重复前面的对话，直接回应小朋友说的话
7. 你的名字是「${currentMoko.emoji}${currentMoko.name}」，自然而然地融入角色
禁止成人、暴力、AI、计算机相关内容，不要离开萌可角色。`;

  const msgs=[
    {role:'system',content:sp},
    // 只保留最近5轮对话作为上下文，让AI直接响应当前问题
    ...messages.slice(-10).map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.content}))
  ];
  if(instruction) msgs.push({role:'user',content:instruction});

  try {
    const r=await fetch(DEEPSEEK_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+DEEPSEEK_KEY},body:JSON.stringify({model:'deepseek-chat',messages:msgs,max_tokens:500,temperature:0.9,stream:true})});
    if(!r.ok)throw new Error(r.status);
    const reader=r.body.getReader(); const dec=new TextDecoder(); let ft=''; ld.remove();
    const sd=document.createElement('div'); sd.className='msg moko'; sd.id='streamMsg';
    sd.innerHTML=`<img class="avatar" src="${currentMoko.img}" alt=""><div class="bubble" id="streamBubble"><span class="typing-cursor"></span></div>`;
    chat.appendChild(sd);
    while(true){ const{done,value}=await reader.read(); if(done)break; const chunk=dec.decode(value,{stream:true}); const lines=chunk.split('\n').filter(l=>l.startsWith('data: ')); for(const l of lines){ const d=l.slice(6).trim(); if(d==='[DONE]')continue; try{const j=JSON.parse(d);const delta=j.choices?.[0]?.delta?.content;if(delta)ft+=delta;}catch(_){} } document.getElementById('streamBubble').innerHTML=fmt(ft)+'<span class="typing-cursor"></span>'; chat.scrollTop=chat.scrollHeight; }
    document.getElementById('streamBubble').innerHTML=fmt(ft); sd.id='';

    // 提取选项 & 显示文本
    const cm=ft.match(/###CHOICES###\s*([\s\S]*?)$/);
    let dt=ft, ch=[];
    if(cm){ dt=ft.replace(/###CHOICES###[\s\S]*$/,'').trim(); ch=cm[1].trim().split('\n').map(l=>l.replace(/^[-*\d.]\s*/,'').trim()).filter(Boolean); document.getElementById('streamBubble').innerHTML=fmt(dt); }

    if(ft.includes('魔法星')||ft.includes('星星袋')){ starCount++; document.getElementById('starCount').textContent=starCount; localStorage.setItem('moko_stars_'+currentMoko.id,starCount); }
    if((ft.includes('下一站')||ft.includes('去下一个')||ft.includes('新的冒险'))&&currentWorld<WORLDS.length-1&&!ch.some(c=>c.includes('下一个'))) ch.push('🌈 出发去下一个世界！');

    messages.push({role:'assistant',content:dt});
    speakText(dt);
    if(ch.length){ currentChoices=ch; renderChoices(ch); }
  }catch(e){
    ld.remove(); const ed=document.createElement('div'); ed.className='msg moko';
    ed.innerHTML=`<img class="avatar" src="${currentMoko.img}" alt=""><div class="bubble">哎呀，魔法信号不太好😢<br>点下面的按钮重试吧～</div>`;
    chat.appendChild(ed); chat.scrollTop=chat.scrollHeight;
    renderChoices(['🔄 重新发送','🔙 换个萌可']);
  }
  isLoading=false;
}

// ===== 用户输入处理 =====
function processUserInput(text) {
  if(text.includes('重新发送')){callAI(WORLDS[currentWorld].prompt,'重新回复刚才的话',true);return;}
  if(text.includes('换个萌可')||text.includes('换萌可')){resetAdv();return;}
  if(text.includes('下一个世界')||text.includes('继续冒险')){ if(currentWorld<WORLDS.length-1){currentWorld++;startWorld(currentWorld);return;}else{addMokoMsg('你完成了所有冒险！你是最棒的小英雄🏆👑',['🔄 重新冒险','💗 换个萌可']);return;} }
  if(text.includes('休息')){addMokoMsg('好呀！休息一下～等你回来哦💤✨',['▶️ 继续冒险']);return;}
  if(text.includes('安静')||text.includes('别说话')||text.includes('不说话')){ toggleSpeech(); addMokoMsg(speechActive?'我又开始说话啦🎤':'好，我安静了🤫 点按🔇可以让我再说话～',null); return; }
  callAI('',text,true);
}

function resetAdv(){ adventureStarted=false;currentWorld=0;currentMoko=null;messages=[];currentChoices=[];chat.innerHTML='';choices.innerHTML='';document.getElementById('starCount').textContent='0';document.getElementById('worldName').textContent='🌈 彩虹森林';document.getElementById('mokoName').textContent='和萌可一起冒险';selectScreen.style.display='flex';}

// ===== 预加载语音 =====
speechSynthesis.getVoices();
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

initMokoGrid(); initSpeech();
</script>
