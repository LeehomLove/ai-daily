<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a2e">
<title>✨ 萌可魔法冒险 ✨</title>
<style>
  :root { --safe-bottom: env(safe-area-inset-bottom, 16px); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(180deg, #0a0a2e 0%, #1a1040 30%, #2d1b69 60%, #1a1040 100%);
    min-height: 100vh; color: #fff;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  /* 星空背景 */
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(2px 2px at 10% 20%, #fff, transparent),
      radial-gradient(2px 2px at 25% 45%, #fff, transparent),
      radial-gradient(1px 1px at 40% 15%, rgba(255,255,255,.7), transparent),
      radial-gradient(2px 2px at 55% 35%, #fff, transparent),
      radial-gradient(1px 1px at 70% 25%, rgba(255,255,255,.8), transparent),
      radial-gradient(2px 2px at 85% 50%, #fff, transparent),
      radial-gradient(3px 3px at 20% 75%, rgba(255,215,0,.6), transparent),
      radial-gradient(2px 2px at 50% 80%, #fff, transparent),
      radial-gradient(2px 2px at 75% 70%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 90% 85%, rgba(255,215,0,.5), transparent),
      radial-gradient(2px 2px at 15% 55%, #fff, transparent),
      radial-gradient(2px 2px at 60% 60%, #fff, transparent);
  }

  .main { position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; max-width:480px; margin:0 auto; }

  /* 顶部栏 */
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; background:rgba(0,0,0,.3); backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .topbar .title { font-size:16px; font-weight:800; }
  .topbar .stars { font-size:14px; }
  .topbar .world {
    font-size:12px; color:rgba(255,255,255,.5); margin-top:0;
  }

  /* 对话区 */
  .chat {
    flex:1; overflow-y:auto; padding:12px 14px;
    display:flex; flex-direction:column; gap:12px;
    -webkit-overflow-scrolling:touch;
  }
  .chat::-webkit-scrollbar { display:none; }

  .msg {
    display:flex; gap:10px; max-width:90%; animation:fadeUp .3s ease;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .msg.moko { align-self:flex-start; }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }

  .msg .avatar {
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    object-fit:cover; border:2px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);
  }
  .msg .bubble {
    background:rgba(255,255,255,.1); backdrop-filter:blur(5px);
    border-radius:18px; padding:10px 14px; font-size:15px; line-height:1.5;
    border:1px solid rgba(255,255,255,.06);
  }
  .msg.user .bubble {
    background:rgba(120,100,255,.3); border:1px solid rgba(120,100,255,.15);
  }
  .msg.moko .bubble { border-radius:18px 18px 18px 4px; }
  .msg.user .bubble { border-radius:18px 18px 4px 18px; }

  .msg .typing { opacity:.5; animation:blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:.5} 50%{opacity:1} }
  .typing-cursor { display:inline-block; width:2px; height:16px; background:#fff; margin-left:2px; animation:blink .6s infinite; vertical-align:middle; }

  /* 选项按钮 */
  .choices {
    display:flex; flex-wrap:wrap; gap:8px; padding:4px 14px 8px;
  }
  .choice-btn {
    background:rgba(255,255,255,.15); backdrop-filter:blur(5px);
    border:1px solid rgba(255,255,255,.15); border-radius:20px;
    padding:10px 18px; color:#fff; font-size:14px; font-weight:600;
    cursor:pointer; font-family:inherit; transition:all .2s;
    flex:1; min-width:100px; text-align:center;
  }
  .choice-btn:active { background:rgba(120,100,255,.4); transform:scale(.96); }

  /* 输入区 */
  .input-area {
    padding:8px 14px var(--safe-bottom) 14px;
    background:rgba(0,0,0,.4); backdrop-filter:blur(10px);
    border-top:1px solid rgba(255,255,255,.08);
  }
  .input-row { display:flex; gap:8px; align-items:center; }
  .voice-btn {
    width:48px; height:48px; border-radius:50%; border:none;
    background:linear-gradient(135deg, #ff4081, #7c4dff);
    color:#fff; font-size:22px; cursor:pointer; flex-shrink:0;
    box-shadow:0 4px 20px rgba(255,64,129,.3);
    transition:all .2s; display:flex; align-items:center; justify-content:center;
    font-family:inherit;
  }
  .voice-btn:active { transform:scale(.9); }
  .voice-btn.recording {
    background:linear-gradient(135deg, #ff1744, #d50000);
    animation:pulse 1s infinite; box-shadow:0 0 30px rgba(255,23,68,.6);
  }
  @keyframes pulse { 0%,100%{box-shadow:0 0 20px rgba(255,23,68,.4)} 50%{box-shadow:0 0 40px rgba(255,23,68,.8)} }
  .text-input {
    flex:1; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.1);
    border-radius:24px; padding:12px 16px; color:#fff; font-size:16px;
    font-family:inherit; outline:none; min-width:0;
  }
  .text-input::placeholder { color:rgba(255,255,255,.35); }
  .send-btn {
    width:48px; height:48px; border-radius:50%; border:none;
    background:rgba(255,255,255,.15); color:#fff; font-size:20px;
    cursor:pointer; flex-shrink:0;
  }
  .send-btn:active { background:rgba(255,255,255,.25); }

  /* 萌可选择页 */
  .select-screen {
    position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.85);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  .select-screen h2 { font-size:24px; margin-bottom:6px; text-align:center; }
  .select-screen .sub { font-size:14px; color:rgba(255,255,255,.5); margin-bottom:20px; text-align:center; }
  .moko-grid {
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; max-width:360px; width:100%;
  }
  .moko-card {
    background:rgba(255,255,255,.08); border-radius:20px; padding:14px 8px;
    text-align:center; cursor:pointer; border:2px solid transparent; transition:all .2s;
  }
  .moko-card:active { background:rgba(120,100,255,.2); border-color:rgba(120,100,255,.4); transform:scale(.95); }
  .moko-card img {
    width:60px; height:60px; border-radius:50%; object-fit:cover; margin-bottom:6px;
    border:2px solid rgba(255,255,255,.3);
  }
  .moko-card .name { font-size:13px; font-weight:700; }

  /* 开场动画 */
  .intro-overlay {
    position:fixed; inset:0; z-index:60; background:radial-gradient(ellipse at center, #1a1040 0%, #0a0a2e 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    animation:fadeOut .5s ease 2s forwards;
  }
  @keyframes fadeOut { to { opacity:0; pointer-events:none; } }
  .intro-overlay .title { font-size:32px; font-weight:900; text-align:center; animation:titleIn .8s ease; }
  @keyframes titleIn { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }
  .intro-overlay .subtitle { font-size:16px; color:rgba(255,255,255,.6); margin-top:8px; animation:subIn .8s ease; }
  @keyframes subIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

  /* 世界切换动画 */
  .world-transition {
    position:fixed; inset:0; z-index:40; background:#0a0a2e;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    animation:worldAnim 2s ease forwards;
  }
  @keyframes worldAnim { 0%{opacity:0} 20%{opacity:1} 80%{opacity:1} 100%{opacity:0;pointer-events:none} }
  .world-transition .icon { font-size:60px; animation:bounce .5s ease infinite; }
  .world-transition .name { font-size:24px; font-weight:900; margin-top:10px; }

  /* 加载提示 */
  .loading-dots { display:inline-flex; gap:4px; }
  .loading-dots span { width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);animation:dotBounce 1.4s infinite; }
  .loading-dots span:nth-child(2) { animation-delay:.2s; }
  .loading-dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes dotBounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-8px)} }
</style>
</head>
<body>

<div class="intro-overlay">
  <div class="title">✨ 萌可<br>魔法冒险 ✨</div>
  <div class="subtitle">和萌可一起探索魔法世界</div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <div class="world" id="worldName">🌈 彩虹森林</div>
      <div class="title" id="mokoName">和萌可一起冒险</div>
    </div>
    <div class="stars">⭐ <span id="starCount">0</span></div>
  </div>

  <div class="chat" id="chat">
    <div class="msg moko">
      <img class="avatar" id="mokoAvatar" src="https://leehomlove.github.io/ai-daily/moko1.jpg" alt="萌可">
      <div class="bubble" id="lastBubble">选一个萌可伙伴，开始魔法冒险吧！✨</div>
    </div>
  </div>

  <div class="choices" id="choices"></div>

  <div class="input-area">
    <div class="input-row">
      <button class="voice-btn" id="voiceBtn" title="按住说话">🎤</button>
      <input class="text-input" id="textInput" type="text" placeholder="输入想说的话…" maxlength="200">
      <button class="send-btn" id="sendBtn" onclick="sendText()">📤</button>
    </div>
  </div>
</div>

<div class="select-screen" id="selectScreen">
  <h2>🦄 选择萌可伙伴</h2>
  <div class="sub">选一个萌可陪你冒险吧！</div>
  <div class="moko-grid" id="mokoGrid"></div>
</div>

<script>
// ===== 配置 =====
const DEEPSEEK_KEY = 'sk-f369a602e9be4452b179433a12fc96e4';
const DEEPSEEK_URL = 'https://api.deepseek.com/chat/completions';
const BASE = 'https://leehomlove.github.io/ai-daily/';

// ===== 萌可伙伴 =====
const MOKOS = [
  { id:'heart',name:'爱心萌可',img:BASE+'moko1.jpg',emoji:'💗',color:'#ff4081',
    persona:'你是爱心萌可💗，爱与温暖的化身。你温柔可爱，喜欢用"啾~"开头。你的一切魔力来自爱。说话温柔，用💗结尾。' },
  { id:'courage',name:'勇气萌可',img:BASE+'moko2.jpg',emoji:'🧡',color:'#ef6c00',
    persona:'你是勇气萌可🧡，充满力量！你爽朗勇敢，什么都不怕。总是说"哈哈！"。你鼓励朋友勇敢。用⚡结尾。' },
  { id:'happy',name:'幸福萌可',img:BASE+'moko3.jpg',emoji:'💛',color:'#f9a825',
    persona:'你是幸福萌可💛，快乐的化身！你总是开开心心。喜欢笑，喜欢把快乐传递给朋友。用☀️结尾。' },
  { id:'sing',name:'唱唱萌可',img:BASE+'moko5.jpg',emoji:'🎵',color:'#c2185b',
    persona:'你是唱唱萌可🎵，爱唱歌的萌可！你说话就像在唱歌，喜欢用歌声让朋友开心。你的魔法是音乐。用🎶结尾。' },
  { id:'hope',name:'盼盼萌可',img:BASE+'moko6.jpg',emoji:'💚',color:'#2e7d32',
    persona:'你是盼盼萌可💚，希望的化身。你温柔积极，总是看到好的一面。你给朋友希望和力量。用🍀结尾。' },
  { id:'wise',name:'正正萌可',img:BASE+'moko4.jpg',emoji:'💙',color:'#1565c0',
    persona:'你是正正萌可💙，智慧的化身。你聪明冷静，总是能给朋友好建议。你的魔法来自知识。用📖结尾。' },
];

// ===== 冒险世界 =====
const WORLDS = [
  { id:'forest', name:'🌈 彩虹森林', icon:'🌈',
    intro:'在这片魔法森林里，彩色的蘑菇会发光，小动物们都会说话。萌可和你在这里开始了冒险之旅！',
    prompt:'你现在在彩虹森林里。这里有发光的蘑菇、会说话的小兔子、彩虹瀑布。萌可刚认识小朋友，带小朋友认识这个魔法世界。引导小朋友探索森林，找到第一个魔法宝石。' },
  { id:'castle', name:'🏰 水晶城堡', icon:'🏰',
    intro:'穿过彩虹森林，你们来到了闪闪发光的水晶城堡！城堡里正在举行萌可舞会，但有个小萌可被困在了塔顶……',
    prompt:'你们来到了水晶城堡。城堡正在举行魔法舞会，到处都是闪闪发光的水晶灯和跳舞的萌可们。但塔顶有个小萌可被困住了。引导小朋友想办法救出小萌可。' },
  { id:'ocean', name:'🌊 星星海洋', icon:'🌊',
    intro:'救出小萌可后，你们发现了一片星星海洋！海面上漂浮着无数闪亮的星星，但有一颗大流星不见了……',
    prompt:'你们来到星星海洋。海面上漂着闪闪发光的星星✨，海里的鱼都是彩虹色的。但是那颗最大的流星不见了。引导小朋友想办法找到失踪的大流星。' },
  { id:'flower', name:'🌸 花之谷', icon:'🌸',
    intro:'找到流星后，你们来到了花瓣飘舞的花之谷。但花儿们都褪色了，需要魔法来恢复颜色……',
    prompt:'你们来到了花之谷。这里的花儿都褪色了变成灰白色，小花朵们在哭泣。只有用萌可的魔法和小朋友的善良才能让花儿恢复颜色。引导小朋友帮助花儿们。' },
  { id:'cloud', name:'☁️ 云朵乐园', icon:'☁️',
    intro:'经历了许多冒险，萌可公主在云朵乐园等着你们！这是最后的冒险，也是最精彩的篇章……',
    prompt:'你们在云朵乐园，这是最终冒险！萌可公主在这里等着你们。回顾这次冒险的精彩回忆，给小朋友颁发勇气勋章。让小朋友感觉自己是最棒的小英雄！' },
];

// ===== 状态 =====
let currentMoko = null;
let currentWorld = 0;
let starCount = 0;
let messages = [];
let isLoading = false;
let adventureStarted = false;
let currentChoices = [];

// DOM
const chat = document.getElementById('chat');
const choices = document.getElementById('choices');
const voiceBtn = document.getElementById('voiceBtn');
const textInput = document.getElementById('textInput');
const selectScreen = document.getElementById('selectScreen');
const mokoGrid = document.getElementById('mokoGrid');

// ===== 初始化 =====
function initMokoGrid() {
  mokoGrid.innerHTML = MOKOS.map(m => `
    <div class="moko-card" onclick="pickMoko('${m.id}')">
      <img src="${m.img}" alt="${m.name}">
      <div class="name">${m.emoji} ${m.name}</div>
    </div>
  `).join('');
}

function pickMoko(id) {
  currentMoko = MOKOS.find(m => m.id === id);
  selectScreen.style.display = 'none';
  document.getElementById('mokoAvatar').src = currentMoko.img;
  document.getElementById('mokoName').textContent = currentMoko.emoji + ' ' + currentMoko.name;
  starCount = parseInt(localStorage.getItem('moko_stars_'+currentMoko.id) || '0');
  document.getElementById('starCount').textContent = starCount;
  if (!adventureStarted) {
    adventureStarted = true;
    currentWorld = 0;
    startWorld(0);
  }
}

function startWorld(idx) {
  currentWorld = idx;
  const w = WORLDS[idx];
  document.getElementById('worldName').textContent = w.icon + ' ' + w.name;

  // 世界切换动画
  const anim = document.createElement('div');
  anim.className = 'world-transition';
  anim.innerHTML = `<div class="icon">${w.icon}</div><div class="name">${w.name}</div>`;
  document.body.appendChild(anim);
  setTimeout(() => anim.remove(), 2000);

  // 重置对话
  messages = [];
  chat.innerHTML = '';
  addMokoMsg(w.intro);
  callAI(w.prompt, '请用萌可的语气，说一句开场白引导小朋友探索这个世界。然后给出2-3个选择。', true);
}

// ===== 消息渲染 =====
function addMokoMsg(text, choicesData) {
  messages.push({ role:'assistant', content:text });
  const div = document.createElement('div');
  div.className = 'msg moko';
  div.innerHTML = `
    <img class="avatar" src="${currentMoko.img}" alt="">
    <div class="bubble">${formatText(text)}</div>
  `;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  if (choicesData && choicesData.length > 0) {
    currentChoices = choicesData;
    renderChoices(choicesData);
  }
}

function addUserMsg(text) {
  messages.push({ role:'user', content:text });
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `
    <div class="bubble">${text}</div>
  `;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function formatText(t) {
  return t
    .replace(/❤️|💗/g,'<span style="color:#ff4081">$&</span>')
    .replace(/✨|⭐|🌟/g,'<span style="color:#ffd700">$&</span>')
    .replace(/🦄|👑/g,'<span style="color:#ce93d8">$&</span>')
    .replace(/\*\*(.*?)\*\*/g,'<b>$1</b>');
}

function renderChoices(data) {
  choices.innerHTML = data.map(c => {
    // AI 返回的选项格式可能是 "选项文本" 或 {text, emoji}
    let text = typeof c === 'string' ? c : (c.text || c.label || '');
    return `<button class="choice-btn" onclick="pickChoice('${text.replace(/'/g,"\\'")}')">${text}</button>`;
  }).join('');
}

function pickChoice(text) {
  choices.innerHTML = '';
  currentChoices = [];
  addUserMsg(text);
  processUserInput(text);
}

// ===== 语音输入 =====
let recognition = null;
let isRecording = false;

function initSpeech() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    voiceBtn.style.opacity = '0.4';
    voiceBtn.title = '语音不支持（请打字）';
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript.trim();
    if (text) {
      textInput.value = text;
      sendText();
    }
    stopRecording();
  };
  recognition.onerror = () => stopRecording();
  recognition.onend = () => stopRecording();
}

function startRecording() {
  if (!recognition) return;
  try {
    isRecording = true;
    voiceBtn.classList.add('recording');
    voiceBtn.textContent = '🔴';
    recognition.start();
  } catch(e) {}
}

function stopRecording() {
  isRecording = false;
  voiceBtn.classList.remove('recording');
  voiceBtn.textContent = '🎤';
}

voiceBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startRecording(); });
voiceBtn.addEventListener('pointerup', () => stopRecording());
voiceBtn.addEventListener('pointerleave', () => stopRecording());

// ===== 文字输入 =====
function sendText() {
  const text = textInput.value.trim();
  if (!text || isLoading) return;
  textInput.value = '';
  addUserMsg(text);
  processUserInput(text);
}

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});

// ===== AI 调用 =====
async function callAI(extraPrompt, instruction, withChoices) {
  if (isLoading) return;
  isLoading = true;
  choices.innerHTML = '';
  currentChoices = [];

  // 添加打字中指示器
  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg moko';
  loadingDiv.id = 'loadingMsg';
  loadingDiv.innerHTML = `
    <img class="avatar" src="${currentMoko.img}" alt="">
    <div class="bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>
  `;
  chat.appendChild(loadingDiv);
  chat.scrollTop = chat.scrollHeight;

  // 构建世界上下文
  const world = WORLDS[currentWorld];
  const worldPrompt = world ? world.prompt : '';
  const choiceHint = withChoices ? '\n\n在回复末尾，用 ###CHOICES### 标记，然后每行一个选项（2-3个选项）。\n例如：\n###CHOICES###\n🌈 去彩虹桥\n🌲 走神秘小路\n🎵 唱歌召唤小鸟' : '';

  const systemPrompt = `${currentMoko.persona}

你现在在冒险世界中：${worldPrompt}

和小朋友对话规则：
1. 每次回复3-6句话，不长不短
2. 用大量emoji让对话有趣
3. 语气像5-12岁孩子的朋友
4. 总是鼓励和表扬小朋友
5. 偶尔给小朋友魔法星星⭐作为奖励（说"送你一颗魔法星⭐！去你的星星袋里看看吧～"）
6. 记住这是第${currentWorld+1}个世界（共5个世界），适当时推进到下一个世界${choiceHint}

绝对禁止：
- 不要说任何成人、暴力或不适合儿童的话
- 不要离开萌可角色
- 不要一次说太多（超过8句话）`;

  const apiMessages = [
    { role:'system', content:systemPrompt },
    ...messages.slice(-20).map(m => ({
      role: m.role === 'assistant' ? 'assistant' : 'user',
      content: m.content
    })),
  ];

  // 如果需要带选项的回复，最后一条是 instruction
  if (instruction) {
    apiMessages.push({ role:'user', content: instruction });
  }

  try {
    const resp = await fetch(DEEPSEEK_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+DEEPSEEK_KEY },
      body: JSON.stringify({ model:'deepseek-chat', messages:apiMessages, max_tokens:600, temperature:0.9, stream:true })
    });

    if (!resp.ok) throw new Error(`API ${resp.status}`);

    // 流式读取
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    loadingDiv.remove();

    // 创建流式气泡
    const streamDiv = document.createElement('div');
    streamDiv.className = 'msg moko';
    streamDiv.id = 'streamMsg';
    streamDiv.innerHTML = `
      <img class="avatar" src="${currentMoko.img}" alt="">
      <div class="bubble" id="streamBubble"><span class="typing-cursor"></span></div>
    `;
    chat.appendChild(streamDiv);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream:true });
      const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
      for (const line of lines) {
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) fullText += delta;
        } catch(e) {}
      }
      document.getElementById('streamBubble').innerHTML = formatText(fullText) + '<span class="typing-cursor"></span>';
      chat.scrollTop = chat.scrollHeight;
    }

    // 完成
    document.getElementById('streamBubble').innerHTML = formatText(fullText);
    streamDiv.id = '';

    // 提取选项
    const choiceMatch = fullText.match(/###CHOICES###\s*([\s\S]*?)$/);
    let displayText = fullText, extractedChoices = [];
    if (choiceMatch) {
      displayText = fullText.replace(/###CHOICES###[\s\S]*$/, '').trim();
      extractedChoices = choiceMatch[1].trim().split('\n').map(l => l.replace(/^[-*\d.]\s*/, '').trim()).filter(Boolean);
      document.getElementById('streamBubble').innerHTML = formatText(displayText);
    }

    // 检查星星
    if (fullText.includes('魔法星') || fullText.includes('星星袋')) {
      starCount++;
      document.getElementById('starCount').textContent = starCount;
      localStorage.setItem('moko_stars_'+currentMoko.id, starCount);
    }

    // 检查世界推进
    if (fullText.includes('下一站') || fullText.includes('去下一个') || fullText.includes('新的冒险') || fullText.includes('跟我来')) {
      if (currentWorld < WORLDS.length - 1) {
        // 给选项去下一个世界
        if (!extractedChoices.length) {
          extractedChoices = ['🌈 出发去下一个世界！'];
        }
        extractedChoices.push('😴 我想休息一下');
      }
    }

    messages.push({ role:'assistant', content: displayText });
    if (extractedChoices.length) {
      currentChoices = extractedChoices;
      renderChoices(extractedChoices);
    }

    // 处理"出发去下一个世界"
    if (extractedChoices.some(c => c.includes('下一个世界') || c.includes('继续冒险'))) {
      // 不自动推进，等用户点击
    }

  } catch(e) {
    loadingDiv.remove();
    const errDiv = document.createElement('div');
    errDiv.className = 'msg moko';
    errDiv.innerHTML = `
      <img class="avatar" src="${currentMoko.img}" alt="">
      <div class="bubble">哎呀，魔法信号不太好😢<br>点一下🔄重试吧～</div>
    `;
    chat.appendChild(errDiv);
    chat.scrollTop = chat.scrollHeight;
    renderChoices(['🔄 重新发送', '🔙 换个萌可']);
    console.error(e);
  }

  isLoading = false;
}

// ===== 处理用户输入 =====
function processUserInput(text) {
  // 特殊命令
  if (text.includes('重新发送')) { callAI(WORLDS[currentWorld].prompt, '重新回复刚才的话', true); return; }
  if (text.includes('换个萌可') || text.includes('换萌可')) { resetAdventure(); return; }
  if (text.includes('下一个世界') || text.includes('继续冒险')) {
    if (currentWorld < WORLDS.length - 1) { currentWorld++; startWorld(currentWorld); return; }
    else { addMokoMsg('你已经完成了所有冒险！你是最棒的小英雄🏆👑 要不要换个萌可重新开始？', ['🔄 重新冒险', '💗 换个萌可']); return; }
  }
  if (text.includes('休息')) { addMokoMsg('好呀！冒险累了就休息一下～等你回来我们继续！💤✨', ['▶️ 继续冒险']); return; }
  if (text.includes('继续冒险')) { callAI(WORLDS[currentWorld].prompt, '小朋友休息好了，继续我们的冒险吧！', true); return; }

  // 正常对话
  callAI('', text, false);
}

function resetAdventure() {
  adventureStarted = false;
  currentWorld = 0;
  currentMoko = null;
  messages = [];
  currentChoices = [];
  chat.innerHTML = '';
  choices.innerHTML = '';
  document.getElementById('starCount').textContent = '0';
  document.getElementById('worldName').textContent = '🌈 彩虹森林';
  document.getElementById('mokoName').textContent = '和萌可一起冒险';
  selectScreen.style.display = 'flex';
}

// ===== 按钮 =====
document.getElementById('sendBtn').addEventListener('click', sendText);
initMokoGrid();
initSpeech();
</script>
