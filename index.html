<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>AI 日报</title>
<style>
  :root {
    --bg: #000000;
    --card: #1c1c1e;
    --text: #ffffff;
    --sub: #8e8e93;
    --accent: #0a84ff;
    --green: #30d158;
    --orange: #ff9f0a;
    --purple: #bf5af2;
    --red: #ff375f;
    --teal: #64d2ff;
    --radius: 16px;
    --safe-bottom: env(safe-area-inset-bottom, 16px);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 var(--safe-bottom) 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Header ===== */
  header {
    position: sticky; top:0; z-index:100;
    background: rgba(0,0,0,.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    padding: 12px 20px 8px;
    border-bottom: .5px solid rgba(255,255,255,.1);
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
  }
  h1 {
    font-size: 30px; font-weight: 700; letter-spacing: -.5px;
    background: linear-gradient(135deg, #0a84ff, #bf5af2, #ff375f);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .date-header { font-size: 14px; color: var(--sub); margin-top: -2px; }
  .refresh-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);
    background: transparent; color: var(--accent);
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .3s;
  }
  .refresh-btn:active { background: rgba(255,255,255,.1); }
  .refresh-btn.spin { animation: spin .8s ease; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Category Tabs ===== */
  .tabs {
    display: flex; gap: 8px;
    padding: 12px 20px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display:none; }
  .tab {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 14px; font-weight: 500;
    background: var(--card);
    color: var(--sub);
    border: none; cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
    font-family: inherit;
  }
  .tab.active {
    background: var(--accent);
    color: #fff;
  }
  .tab:active { transform: scale(.95); }

  /* ===== Stats Bar ===== */
  .stats {
    display: flex; gap: 16px;
    padding: 0 20px 4px;
    font-size: 13px; color: var(--sub);
  }
  .stats span { display:flex; align-items:center; gap:4px; }

  /* ===== News Cards ===== */
  .news-list { padding: 8px 16px 40px; }
  .news-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform .15s, background .2s;
    border: .5px solid rgba(255,255,255,.06);
    position: relative;
    overflow: hidden;
  }
  .news-card:active { transform: scale(.985); background: #222; }

  /* 分类色条 */
  .news-card::before {
    content: '';
    position: absolute;
    left: 0; top: 16px; bottom: 16px;
    width: 3px; border-radius: 0 2px 2px 0;
  }
  .news-card.cat-model::before   { background: var(--accent); }
  .news-card.cat-product::before { background: var(--green); }
  .news-card.cat-industry::before{ background: var(--orange); }
  .news-card.cat-paper::before   { background: var(--purple); }
  .news-card.cat-insight::before { background: var(--teal); }

  .card-meta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .card-category {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    padding: 2px 8px; border-radius: 10px;
    letter-spacing: .3px;
  }
  .cat-model   .card-category { background: rgba(10,132,255,.2); color: var(--accent); }
  .cat-product .card-category { background: rgba(48,209,88,.2);  color: var(--green); }
  .cat-industry .card-category{ background: rgba(255,159,10,.2); color: var(--orange); }
  .cat-paper   .card-category { background: rgba(191,90,242,.2); color: var(--purple); }
  .cat-insight .card-category { background: rgba(100,210,255,.2); color: var(--teal); }

  .card-source {
    font-size: 12px; color: var(--sub);
    flex: 1; text-align: right;
  }
  .card-title {
    font-size: 17px; font-weight: 600;
    line-height: 1.4; margin-bottom: 6px;
  }
  .card-summary {
    font-size: 14px; color: var(--sub);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ===== Skeleton Loading ===== */
  .skeleton {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .skeleton-line {
    height: 12px; border-radius: 6px;
    background: linear-gradient(90deg, #2c2c2e 25%, #3a3a3c 50%, #2c2c2e 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    margin-bottom: 10px;
  }
  .skeleton-line:last-child { margin-bottom:0; }
  .skeleton-line.title { width: 80%; height: 16px; }
  .skeleton-line.body  { width: 100%; }
  .skeleton-line.body2 { width: 60%; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ===== Empty / Error ===== */
  .empty-state {
    text-align: center; padding: 60px 40px; color: var(--sub);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state .msg { font-size: 16px; line-height: 1.5; }
  .retry-btn {
    margin-top: 16px; padding: 10px 28px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 20px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .retry-btn:active { opacity: .7; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff;
    padding: 10px 24px; border-radius: 20px;
    font-size: 14px; font-weight: 600;
    z-index: 9999;
    opacity: 0; transition: opacity .3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

  <header>
    <div class="header-top">
      <div>
        <h1>AI 日报</h1>
        <div class="date-header" id="header-date">--</div>
      </div>
      <button class="refresh-btn" id="refresh-btn" onclick="refresh()" title="刷新">⟳</button>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="">全部</button>
    <button class="tab" data-cat="model">🤖 模型</button>
    <button class="tab" data-cat="product">🚀 产品</button>
    <button class="tab" data-cat="industry">📊 行业</button>
    <button class="tab" data-cat="paper">📄 论文</button>
    <button class="tab" data-cat="insight">💡 观点</button>
  </div>

  <div class="stats">
    <span>📰 <span id="stat-count">--</span> 条精选</span>
    <span>🕐 更新于 <span id="stat-time">--</span></span>
  </div>

  <div class="news-list" id="news-list">
    <!-- Skeleton -->
    <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-line body"></div><div class="skeleton-line body2"></div></div>
    <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-line body"></div><div class="skeleton-line body2"></div></div>
    <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-line body"></div><div class="skeleton-line body2"></div></div>
    <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-line body"></div><div class="skeleton-line body2"></div></div>
    <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-line body"></div><div class="skeleton-line body2"></div></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // ===== Config =====
  const API_DIRECT  = 'https://aihot.virxact.com/api/public/items?mode=selected&take=50';
  const API_PROXIED = 'https://whateverorigin.org/get?url=' + encodeURIComponent(API_DIRECT);
  const CACHE_KEY = 'ai_daily_cache';
  const CACHE_DURATION = 10 * 60 * 1000; // 10 min

  const CAT_NAMES = {
    model: '模型', product: '产品', industry: '行业',
    paper: '论文', insight: '观点'
  };

  let allItems = [];
  let currentCat = '';

  // ===== Init =====
  document.getElementById('header-date').textContent =
    new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

  // Tabs
  document.getElementById('tabs').addEventListener('click', e => {
    if (!e.target.classList.contains('tab')) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentCat = e.target.dataset.cat;
    renderCards(currentCat);
  });

  // ===== Data Fetch =====
  async function fetchNews(force = false) {
    // Check cache
    if (!force) {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        try {
          const { items, ts } = JSON.parse(cached);
          if (Date.now() - ts < CACHE_DURATION && items.length > 0) {
            allItems = items;
            renderCards(currentCat);
            updateStats();
            return;
          }
        } catch(e) {}
      }
    }

    try {
      const resp = await fetch(API_DIRECT).catch(() => fetch(API_PROXIED));
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      let data = await resp.text();

      // whateverorigin wraps response in { contents: "..." }
      try { const json = JSON.parse(data); if (json.contents) data = json.contents; } catch(_) {}

      const parsed = JSON.parse(data);

      // AIHOT 返回格式: { items: [...], total, ... } 或直接数组
      const raw = Array.isArray(parsed) ? parsed : (parsed.items || parsed.data || []);
      allItems = raw.map(item => ({
        id: item.id || Math.random(),
        title: item.title_zh || item.title || '无标题',
        summary: item.summary_zh || item.summary || item.content_zh || item.content || '',
        category: (item.category || 'other').toLowerCase(),
        source: item.source_name || item.source || '',
        url: item.url || item.link || '',
        published: item.published_at || item.created_at || item.date || ''
      }));

      // Save cache
      localStorage.setItem(CACHE_KEY, JSON.stringify({ items: allItems, ts: Date.now() }));
      renderCards(currentCat);
      updateStats();
      toast('已刷新 ✓');
    } catch(e) {
      console.error('Fetch error:', e);
      // Fallback to cache
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        try {
          const { items } = JSON.parse(cached);
          allItems = items;
          renderCards(currentCat);
          updateStats();
          toast('离线模式，显示缓存');
          return;
        } catch(_) {}
      }
      showError(e.message);
    }
  }

  async function refresh() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spin');
    await fetchNews(true);
    setTimeout(() => btn.classList.remove('spin'), 800);
  }

  // ===== Render =====
  function renderCards(cat) {
    const list = document.getElementById('news-list');
    const filtered = cat ? allItems.filter(i => i.category === cat) : allItems;

    if (!filtered.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">📭</div>
          <div class="msg">${cat ? '该分类暂无内容' : '暂无数据'}</div>
          <button class="retry-btn" onclick="refresh()">重新加载</button>
        </div>`;
      return;
    }

    list.innerHTML = filtered.map(item => `
      <div class="news-card cat-${item.category}" onclick="openLink('${escAttr(item.url)}')">
        <div class="card-meta">
          <span class="card-category">${CAT_NAMES[item.category] || item.category}</span>
          <span class="card-source">${esc(item.source)}</span>
        </div>
        <div class="card-title">${esc(item.title)}</div>
        ${item.summary ? `<div class="card-summary">${esc(item.summary)}</div>` : ''}
      </div>
    `).join('');

    document.getElementById('stat-count').textContent = filtered.length;
    document.getElementById('stat-time').textContent =
      new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
  }

  function updateStats() {
    document.getElementById('stat-count').textContent = allItems.length;
    document.getElementById('stat-time').textContent =
      new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
  }

  function showError(msg) {
    document.getElementById('news-list').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <div class="msg">加载失败<br><small>${esc(msg)}</small></div>
        <button class="retry-btn" onclick="refresh()">重试</button>
      </div>`;
  }

  // ===== Helpers =====
  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(s) { return s ? s.replace(/'/g,"\\'").replace(/"/g,'&quot;') : '#'; }
  function openLink(url) {
    if (url && url !== '#') window.open(url, '_blank', 'noopener');
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._tid);
    el._tid = setTimeout(() => el.classList.remove('show'), 2000);
  }

  // ===== PWA Service Worker =====
  if ('serviceWorker' in navigator) {
    // 简单的离线缓存
    window.addEventListener('load', () => {
      navigator.serviceWorker.register("data:application/javascript," + encodeURIComponent(`
        const CACHE = 'ai-daily-v1';
        self.addEventListener('install', e => e.waitUntil(
          caches.open(CACHE).then(c => c.addAll(['/']))
        ));
        self.addEventListener('fetch', e => {
          e.respondWith(
            caches.match(e.request).then(r => r || fetch(e.request).then(resp => {
              if (resp.ok) {
                const clone = resp.clone();
                caches.open(CACHE).then(c => c.put(e.request, clone));
              }
              return resp;
            }))
          );
        });
      `)).catch(() => {});
    });
  }

  // ===== Boot =====
  fetchNews();
</script>
</body>
</html>
